name: historical-replay
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CPU Torch for the existing TD3 tests and environment factories
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install offline replay and test dependencies
        run: python -m pip install numpy pandas gym==0.26.2 python-dotenv pytest pyyaml matplotlib seaborn requests aiohttp
      - name: Exercise public replay entrypoint
        run: python -m simulator.replay --help
      - name: Unit and subprocess replay tests (no network or model calls)
        run: python -m pytest tests -q
